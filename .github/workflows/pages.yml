name: Publish website
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      site_url:
        description: 'Confirmed HTTPS origin, e.g. https://valentinshishkin.dev'
        required: false
        type: string
        default: 'https://valentinshishkin.dev'
      base_path:
        description: 'Deployment path: / for a user site or custom domain, /repository/ for a project site'
        required: false
        type: string
        default: '/'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SITE_URL: ${{ inputs.site_url || 'https://valentinshishkin.dev' }}
      BASE_PATH: ${{ inputs.base_path || '/' }}
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - name: Build website and current CV downloads
        run: npm run generate:docs
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
